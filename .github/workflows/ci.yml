name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  capability-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capability gateway unit tests
        run: python -m unittest discover -s capability_gateway/tests -v

  hermes-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hermes plugin unit tests
        run: python -m unittest discover -s hermes-plugins/tests -v

  smb-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SMB contract dependencies
        run: python -m pip install pyyaml
      - name: Validate repository and SMB runtime source
        run: |
          bash scripts/validate.sh
          bash -n scripts/smb/up.sh scripts/smb/down.sh scripts/smb/smoke.sh scripts/smb/test-compose.sh
          python -m compileall -q subscription_gateway scripts/smb
      - name: Test subscription relay and SMB bootstrap contracts
        run: |
          python -m unittest discover -s subscription_gateway/tests -v
          python -m unittest discover -s scripts/smb/tests -v
      - name: Render minimal Compose with fake credentials only
        run: bash scripts/smb/test-compose.sh

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and tests
        run: npm run check
