name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  capability-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capability gateway unit tests
        run: python -m unittest discover -s capability_gateway/tests -v

  hermes-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hermes plugin unit tests
        run: python -m unittest discover -s hermes-plugins/tests -v

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and tests
        run: npm run check

  smb-runtime:
    name: SMB subscription-bound runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert subscription and authority contracts
        run: python -m unittest discover -s smb/tests -p 'test_*.py' -v
      - name: Render standalone five-service runtime with fake CI-only entitlement
        run: python smb/tests/check_compose.py
      - name: Fetch pinned operator skills and verify install
        run: |
          python3 scripts/smb-fetch-skills.py --target "$RUNNER_TEMP/hermeteam-operator-skills"
          test -f "$RUNNER_TEMP/hermeteam-operator-skills/devops-engineer/SKILL.md"
          test -f "$RUNNER_TEMP/hermeteam-operator-skills/security-reviewer/SKILL.md"
          test -f "$RUNNER_TEMP/hermeteam-operator-skills/rlm-roec-context-reasoning/SKILL.md
