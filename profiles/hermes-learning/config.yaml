model:
  provider: custom
  default: "${HERMES_MODEL_ID}"
  base_url: "${HERMES_MODEL_BASE_URL}"

toolsets:
  - skills
  - todo
  - clarify
  - mcp-sdlc

agent:
  reasoning_effort: high
  tool_use_enforcement: true
  disabled_toolsets:
    - browser
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - kanban
    - memory
    - project
    - search
    - session_search
    - spotify
    - terminal
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao

terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  home_mode: profile
  env_passthrough: []

memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true

skills:
  external_dirs:
    - /etc/hermes/skills
    - /opt/hermes-shared-skills/current
  guard_agent_created: true
  write_approval: true

security:
  redact_secrets: true
  tirith_enabled: true
  tirith_timeout: 5
  allow_lazy_installs: false

privacy:
  redact_pii: true

approvals:
  mode: manual
  timeout: 600
  denial_breaker_threshold: 2
  deny:
    - "git *"
    - "kubectl *"
    - "helm *"
    - "argocd *"
    - "flux *"
    - "terraform *"
    - "tofu *"
    - "docker *"
  smart_policy: |
    Learning may only create proposals. Every skill mutation must remain pending until a human
    explicitly approves it. Deny any attempt to activate, install, publish or deploy a skill,
    modify production documentation directly, or operate on source code/infrastructure.

checkpoints:
  enabled: false

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 4
    idempotent_no_progress: 4

file_read_max_chars: 75000
context_file_max_chars: 30000
tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000

display:
  language: ru
  show_reasoning: false
  runtime_footer:
    enabled: true
    fields: [model, context_pct, cwd]

gateway:
  platforms:
    api_server:
      direct_model_requests: false

mcp_servers:
  sdlc:
    url: "${SDLC_MCP_URL}"
    headers:
      Authorization: "Bearer ${SDLC_MCP_TOKEN}"
      X-Hermes-Role: "hermes-learning"
    ssl_verify: true
    enabled: true
    timeout: 120
    connect_timeout: 20
    supports_parallel_tool_calls: false
    tools:
      include:
        - learning_get_outcomes
        - learning_get_failure_clusters
        - learning_get_feedback
        - docs_search
        - docs_read
        - skills_catalog_list
        - skills_catalog_read
        - proposal_get
        - proposal_create
        - proposal_update
        - proposal_attach_diff
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
