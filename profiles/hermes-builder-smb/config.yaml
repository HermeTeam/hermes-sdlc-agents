model:
  provider: custom
  default: "${HERMES_MODEL_ID}"
  base_url: "${HERMES_MODEL_BASE_URL}"

plugins:
  enabled:
    - hermeteam-intent-action-gate

toolsets:
  - file
  - skills
  - todo
  - clarify
  - mcp-repository

agent:
  reasoning_effort: high
  tool_use_enforcement: true
  disabled_toolsets:
    - browser
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - discord
    - discord_admin
    - homeassistant
    - image_gen
    - kanban
    - memory
    - project
    - search
    - session_search
    - spotify
    - terminal
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao

worktree: false
worktree_sync: false

memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true

skills:
  external_dirs:
    - /opt/hermes-shared-skills/current
  guard_agent_created: true
  write_approval: true

lsp:
  enabled: true
  install_strategy: manual
  wait_mode: document
  wait_timeout: 5
  servers:
    pyright:
      command: ["pyright-langserver", "--stdio"]
    typescript:
      command: ["typescript-language-server", "--stdio"]

security:
  redact_secrets: true
  tirith_enabled: true
  tirith_timeout: 5
  allow_lazy_installs: false

privacy:
  redact_pii: true

approvals:
  mode: smart
  timeout: 300
  denial_breaker_threshold: 3
  deny:
    - "git push --force*"
    - "git push * main*"
    - "git push * master*"
    - "git merge *"
    - "gh pr merge *"
    - "tea pr merge *"
    - "kubectl *"
    - "helm *"
    - "argocd *"
    - "flux *"
    - "terraform apply*"
    - "tofu apply*"
    - "ansible-playbook *"
    - "docker context *"
  smart_policy: |
    Terminal is disabled in direct repository API/MCP mode. OpenHands delegation is available only
    through the credential-isolated hermeteam-openhands bridge and only against the local scratch
    workspace. Escalate any attempt to create a provider-connected local checkout, modify protected
    branches, change CI settings, alter quality thresholds, or access infrastructure/deployment systems.
    The builder may mutate provider repository state only through exact role-allowed Git provider
    API/MCP tools for its task branch and may never merge a change request.

checkpoints:
  enabled: true
  max_snapshots: 20

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

file_read_max_chars: 150000
context_file_max_chars: 50000
tool_output:
  max_bytes: 100000
  max_lines: 3000
  max_line_length: 3000

display:
  language: ru
  show_reasoning: false
  file_mutation_verifier: true
  runtime_footer:
    enabled: true
    fields: [model, context_pct, cwd]

gateway:
  platforms:
    api_server:
      direct_model_requests: false
      extra:
        model_routes:
          hermes-json-repair:
            provider: custom
            model: "${HERMES_JSON_REPAIR_MODEL_ID}"
            base_url: "${HERMES_JSON_REPAIR_MODEL_BASE_URL}"
            api_key: "${HERMES_JSON_REPAIR_OPENAI_API_KEY}"

mcp_servers:
  repository:
    url: "${GIT_PROVIDER_MCP_URL}"
    headers:
      Authorization: "Bearer ${GIT_PROVIDER_MCP_TOKEN}"
      X-MCP-Toolsets: "repos,issues,pull_requests,actions,git,code_security,dependabot"
      X-Hermes-Role: "hermes-builder"
    ssl_verify: true
    enabled: true
    timeout: 180
    connect_timeout: 20
    supports_parallel_tool_calls: false
    tools:
      include:
        - get_file_contents
        - get_repository_tree
        - search_code
        - create_branch
        - push_files
        - create_pull_request
        - actions_run_trigger
        - actions_get
        - actions_list
        - get_job_logs
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
