model:
  provider: custom
  default: "${HERMES_MODEL_ID}"
  base_url: "${HERMES_MODEL_BASE_URL}"

toolsets:
  - skills
  - todo
  - mcp-sdlc
  - mcp-ddg-search
  - mcp-context7
  - mcp-playwright
  - mcp-sequentialthinking
  - mcp-MongoDB
  - mcp-filesystem
  - mcp-puppeteer
  - mcp-postgresql
  - mcp-brave-search
  - mcp-docs-langchain
  - mcp-mcp-mermaid
  - mcp-chrome-devtools

agent:
  reasoning_effort: high
  tool_use_enforcement: true
  disabled_toolsets:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - kanban
    - memory
    - project
    - search
    - session_search
    - spotify
    - terminal
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao

terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  home_mode: profile
  env_passthrough: []

memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true

skills:
  external_dirs:
    - /etc/hermes/skills
    - /opt/hermes-shared-skills/current
  guard_agent_created: true
  write_approval: true

security:
  redact_secrets: true
  tirith_enabled: true
  tirith_timeout: 5
  allow_lazy_installs: false

privacy:
  redact_pii: true

approvals:
  mode: manual
  timeout: 300
  denial_breaker_threshold: 2
  deny:
    - "*"

checkpoints:
  enabled: false

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 3
    idempotent_no_progress: 3

file_read_max_chars: 50000
context_file_max_chars: 25000
tool_output:
  max_bytes: 50000
  max_lines: 1500
  max_line_length: 2000

display:
  language: ru
  show_reasoning: false
  runtime_footer:
    enabled: true
    fields: [model, context_pct, cwd]

gateway:
  platforms:
    api_server:
      direct_model_requests: false

mcp_servers:
  sdlc:
    url: "${SDLC_MCP_URL}"
    headers:
      Authorization: "Bearer ${SDLC_MCP_TOKEN}"
      X-Hermes-Role: "hermes-release"
    ssl_verify: true
    enabled: true
    timeout: 180
    connect_timeout: 20
    supports_parallel_tool_calls: false
    tools:
      include:
        - release_get_candidate
        - release_get_policy
        - ci_get_status
        - ci_get_test_results
        - quality_get_gates
        - observability_query_metric
        - observability_get_slo
        - deployment_get_status
        - deployment_get_analysis
        - deployment_promote
        - deployment_abort
        - deployment_get_audit_log
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  ddg-search:
    command: uvx
    args:
      - duckduckgo-mcp-server
    enabled: false
    tools:
      include:
        - fetch_content
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  context7:
    command: npx
    args:
      - -y
      - "@upstash/context7-mcp"
    env:
      DEFAULT_MINIMUM_TOKENS: "${CONTEXT7_DEFAULT_MINIMUM_TOKENS}"
    enabled: true
    tools:
      include:
        - resolve-library-id
        - query-docs
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  playwright:
    command: npx
    args:
      - -y
      - "@playwright/mcp@0.0.38"
    enabled: false
    tools:
      include:
        - browser_take_screenshot
        - browser_click
        - browser_wait_for
        - browser_evaluate
        - browser_fill_form
        - browser_network_requests
        - browser_close
        - browser_snapshot
        - browser_resize
        - browser_console_messages
        - browser_type
        - browser_navigate
        - browser_file_upload
        - browser_handle_dialog
        - browser_select_option
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  sequentialthinking:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-sequential-thinking"
    enabled: true
    tools:
      include:
        - sequentialthinking
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  MongoDB:
    command: npx
    args:
      - -y
      - mongodb-mcp-server@latest
      - --readOnly
    env:
      MDB_MCP_CONNECTION_STRING: "${MDB_MCP_CONNECTION_STRING}"
    enabled: false
    tools:
      include:
        - list-databases
        - list-collections
        - count
        - collection-schema
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  filesystem:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - "~"
      - "."
    enabled: true
    tools:
      include:
        - list_allowed_directories
        - write_file
        - search_files
        - read_text_file
        - list_directory
        - create_directory
        - read_file
        - get_file_info
        - read_multiple_files
        - read_media_file
        - directory_tree
      exclude:
        - edit_file
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  puppeteer:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-puppeteer"
    enabled: false
    tools:
      include: []
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  postgresql:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-postgres"
      - "${POSTGRES_MCP_CONNECTION_STRING}"
    enabled: true
    tools:
      include:
        - query
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  brave-search:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-brave-search"
    env:
      BRAVE_API_KEY: "${BRAVE_API_KEY}"
    enabled: true
    tools:
      include:
        - brave_web_search
        - brave_local_search
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  docs-langchain:
    url: https://docs.langchain.com/mcp
    enabled: false
    tools:
      include: []
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  mcp-mermaid:
    command: npx
    args:
      - -y
      - mcp-mermaid
    enabled: false
    tools:
      include: []
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
  chrome-devtools:
    command: npx
    args:
      - -y
      - chrome-devtools-mcp@latest
    enabled: true
    tools:
      include:
        - new_page
        - navigate_page
        - take_snapshot
        - take_screenshot
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
