name: hermes-release
version: 1.0.0
description: "Release controller: читает CI и метрики и вызывает только promote либо abort для существующего release candidate. Не выполняет kubectl и не меняет код."
hermes_requires: ">=0.19.0"
author: "SDLC Platform Team"
license: "MIT"
env_requires:
  - name: HERMES_MODEL_ID
    description: "Идентификатор модели в OpenAI-совместимом LLM gateway"
    required: true
  - name: HERMES_MODEL_BASE_URL
    description: "URL OpenAI-совместимого LLM gateway, включая /v1"
    required: true
  - name: OPENAI_API_KEY
    description: "Ролевой токен к LLM gateway"
    required: true
  - name: SDLC_MCP_URL
    description: "URL Streamable HTTP endpoint типизированного SDLC MCP gateway"
    required: true
  - name: SDLC_MCP_TOKEN
    description: "Короткоживущий токен с claim role=hermes-release"
    required: true
distribution_owned:
  - distribution.yaml
  - config.yaml
  - SOUL.md
  - skills/
