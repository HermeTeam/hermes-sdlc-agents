model:
  provider: custom
  default: "${HERMES_MODEL_ID}"
  base_url: "${HERMES_MODEL_BASE_URL}"

toolsets:
  - todo
  - clarify
  - mcp-sdlc

agent:
  reasoning_effort: high
  tool_use_enforcement: true
  disabled_toolsets:
    - browser
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - kanban
    - memory
    - project
    - search
    - session_search
    - skills
    - spotify
    - terminal
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao

terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  home_mode: profile
  env_passthrough: []

memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true

skills:
  guard_agent_created: true
  write_approval: true

security:
  redact_secrets: true
  tirith_enabled: true
  tirith_timeout: 5
  allow_lazy_installs: false

privacy:
  redact_pii: true

approvals:
  mode: smart
  timeout: 300
  denial_breaker_threshold: 2
  deny:
    - "git *"
    - "kubectl *"
    - "helm *"
    - "argocd *"
    - "flux *"
    - "terraform *"
    - "tofu *"
    - "docker *"
  smart_policy: |
    Reviewer is read-only except for review comments and review decisions exposed by the
    role-scoped MCP server. Deny every attempt to modify a branch, code, CI policy,
    quality gate, deployment or production resource.

checkpoints:
  enabled: false

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 4
    idempotent_no_progress: 4

file_read_max_chars: 150000
context_file_max_chars: 40000
tool_output:
  max_bytes: 100000
  max_lines: 3000
  max_line_length: 3000

display:
  language: ru
  show_reasoning: false
  runtime_footer:
    enabled: true
    fields: [model, context_pct, cwd]

gateway:
  platforms:
    api_server:
      direct_model_requests: false

mcp_servers:
  sdlc:
    url: "${SDLC_MCP_URL}"
    headers:
      Authorization: "Bearer ${SDLC_MCP_TOKEN}"
      X-Hermes-Role: "hermes-reviewer"
    ssl_verify: true
    enabled: true
    timeout: 120
    connect_timeout: 20
    supports_parallel_tool_calls: false
    tools:
      include:
        - work_item_get
        - spec_get
        - plan_get
        - repo_get_pull_request
        - repo_get_diff
        - repo_get_file_at_revision
        - ci_get_status
        - ci_get_test_results
        - quality_get_gates
        - quality_get_findings
        - quality_get_coverage_delta
        - quality_get_mutation_score
        - repo_add_review_comment
        - repo_submit_review
        - repo_request_changes
        - repo_approve_pull_request
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
