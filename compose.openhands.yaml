services:
  hermes-builder-openhands:
    image: "${HERMES_OPENHANDS_IMAGE:-hermes-builder-openhands:local}"
    build:
      context: .
      dockerfile: Dockerfile.openhands-runner
      args:
        OPENHANDS_VERSION: "${OPENHANDS_VERSION:-1.16.0}"
    container_name: hermes-builder-openhands
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    cpus: "2.0"
    mem_limit: 4g
    env_file:
      - path: ./secrets/hermes-builder-openhands.env
        required: true
    environment:
      OPENHANDS_RUNNER_SOCKET: /opt/data/workspace/.hermeteam-openhands/runner.sock
      OPENHANDS_SHARED_SKILLS_ROOT: /opt/hermes-shared-skills/current
    depends_on:
      skills-superset-sync:
        condition: service_completed_successfully
    volumes:
      - ./workspace/builder:/opt/data/workspace
      - shared-skills:/opt/hermes-shared-skills:ro
    networks:
      - openhands-egress
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import os,stat; p='/opt/data/workspace/.hermeteam-openhands/runner.sock'; s=os.stat(p); raise SystemExit(0 if stat.S_ISSOCK(s.st_mode) else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  hermes-builder:
    depends_on:
      hermes-builder-openhands:
        condition: service_healthy
    environment:
      BUILDER_OPENHANDS_ENABLED: "${BUILDER_OPENHANDS_ENABLED:-true}"

networks:
  openhands-egress:
    driver: bridge
