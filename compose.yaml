name: hermes-sdlc

x-hermes-environment: &hermes-environment
  HERMES_MANAGED_DIR: /etc/hermes
  HERMES_DASHBOARD: "0"
  API_SERVER_ENABLED: "true"
  API_SERVER_HOST: "0.0.0.0"
  API_SERVER_PORT: "8642"
  HERMES_WRITE_SAFE_ROOT: /opt/data
  OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}"
  GIT_PROVIDER_MCP_URL: "${GIT_PROVIDER_MCP_URL:?Set GIT_PROVIDER_MCP_URL in .env}"
  REPOSITORY_ID: "${REPOSITORY_ID:?Set REPOSITORY_ID in .env}"
  REPOSITORY_PROVIDER: "${REPOSITORY_PROVIDER:?Set REPOSITORY_PROVIDER in .env}"
  REPOSITORY_ACCESS_MODE: "${REPOSITORY_ACCESS_MODE:?Set REPOSITORY_ACCESS_MODE in .env}"
  REPOSITORY_DEFAULT_BRANCH: "${REPOSITORY_DEFAULT_BRANCH:?Set REPOSITORY_DEFAULT_BRANCH in .env}"
  REPOSITORY_CLONE_ALLOWED: "${REPOSITORY_CLONE_ALLOWED:?Set REPOSITORY_CLONE_ALLOWED in .env}"
  GITHUB_API_BASE_URL: "${GITHUB_API_BASE_URL:?Set GITHUB_API_BASE_URL in .env}"
  GITHUB_WEB_BASE_URL: "${GITHUB_WEB_BASE_URL:?Set GITHUB_WEB_BASE_URL in .env}"
  GITHUB_OWNER: "${GITHUB_OWNER:?Set GITHUB_OWNER in .env}"
  GITHUB_REPOSITORY: "${GITHUB_REPOSITORY:?Set GITHUB_REPOSITORY in .env}"
  GITHUB_REPOSITORY_FULL_NAME: "${GITHUB_REPOSITORY_FULL_NAME:?Set GITHUB_REPOSITORY_FULL_NAME in .env}"
  GITHUB_REPOSITORY_HTML_URL: "${GITHUB_REPOSITORY_HTML_URL:?Set GITHUB_REPOSITORY_HTML_URL in .env}"
  GITHUB_REPOSITORY_API_URL: "${GITHUB_REPOSITORY_API_URL:?Set GITHUB_REPOSITORY_API_URL in .env}"
  ORCHESTRATOR_ENABLED: "${ORCHESTRATOR_ENABLED:-false}"
  ORCHESTRATOR_PROVIDER: "${ORCHESTRATOR_PROVIDER:-github}"
  ORCHESTRATOR_CRON_SCHEDULE: "${ORCHESTRATOR_CRON_SCHEDULE:-*/5 * * * *}"
  ORCHESTRATOR_DB_PATH: /opt/data/sdlc-orchestrator/orchestrator.sqlite
  ORCHESTRATOR_LOCK_PATH: /opt/data/sdlc-orchestrator/run_once.lock
  ORCHESTRATOR_HERMES_URL: http://127.0.0.1:8642
  ORCHESTRATOR_MAX_STARTS_PER_TICK: "${ORCHESTRATOR_MAX_STARTS_PER_TICK:-1}"
  ORCHESTRATOR_RUN_TIMEOUT_SECONDS: "${ORCHESTRATOR_RUN_TIMEOUT_SECONDS:-5400}"
  ORCHESTRATOR_APPLY_TRANSITIONS: "${ORCHESTRATOR_APPLY_TRANSITIONS:-false}"
  ORCHESTRATOR_TRANSITION_COMMENT_ONLY: "${ORCHESTRATOR_TRANSITION_COMMENT_ONLY:-true}"
  PYTHONPATH: /opt/hermes-sdlc-orchestrator

x-hermes-common: &hermes-common
  image: "${HERMES_ORCHESTRATOR_IMAGE:-hermes-sdlc-agent-orchestrator:local}"
  build:
    context: .
    dockerfile: Dockerfile.orchestrator
    args:
      HERMES_BASE_IMAGE: "${HERMES_IMAGE:-nousresearch/hermes-agent:latest}"
  entrypoint: [/opt/hermes-sdlc-orchestrator/bin/hermes-with-orchestrator.sh]
  depends_on:
    skills-superset-sync:
      condition: service_completed_successfully
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  pids_limit: 512
  cpus: "2.0"
  mem_limit: 4g
  stop_grace_period: 45s
  extra_hosts:
    - host.docker.internal:host-gateway
  networks:
    - hermes-control
  healthcheck:
    test: [CMD, curl, -fsS, http://127.0.0.1:8642/health]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 45s
services:
  skills-superset-sync:
    image: alpine/git:2.49.1
    entrypoint: []
    container_name: hermes-skills-superset-sync
    restart: "no"
    environment:
      SKILLS_SUPERSET_REPO_URL: "${SKILLS_SUPERSET_REPO_URL:-https://github.com/stanta/skills_superset.git}"
      SKILLS_SUPERSET_REF: "${SKILLS_SUPERSET_REF:-main}"
    command:
      - /bin/sh
      - -ec
      - |
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$${tmp_dir}"' EXIT
        git clone --depth=1 --filter=blob:none --sparse "$${SKILLS_SUPERSET_REPO_URL}" "$${tmp_dir}/repo"
        git -C "$${tmp_dir}/repo" checkout "$${SKILLS_SUPERSET_REF}"
        git -C "$${tmp_dir}/repo" sparse-checkout set skills
        rm -rf /shared/.next /shared/current
        mkdir -p /shared/.next
        cp -a "$${tmp_dir}/repo/skills/." /shared/.next/
        mv /shared/.next /shared/current
    networks:
      - hermes-control
    volumes:
      - shared-skills:/shared

  hermes-planner:
    <<: *hermes-common
    container_name: hermes-planner
    env_file: [./secrets/hermes-planner.env]
    environment:
      <<: *hermes-environment
      ORCHESTRATOR_ROLE: planner
      ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_PLANNER_GITHUB_TOKEN:?Set ORCHESTRATOR_PLANNER_GITHUB_TOKEN in .env}"
      GIT_PROVIDER_MCP_TOKEN: "${PLANNER_GITHUB_MCP_TOKEN:?Set PLANNER_GITHUB_MCP_TOKEN in .env}"
    ports:
      - "127.0.0.1:${PLANNER_API_PORT:-18642}:8642"
    volumes:
      - planner-data:/opt/data
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-planner:/etc/hermes:ro
      - ./profiles/hermes-planner/SOUL.md:/opt/data/SOUL.md:ro

  hermes-project-manager:
    <<: *hermes-common
    container_name: hermes-project-manager
    env_file: [./secrets/hermes-project-manager.env]
    environment:
      <<: *hermes-environment
      ORCHESTRATOR_ROLE: project-manager
      ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_PROJECT_MANAGER_GITHUB_TOKEN:?Set ORCHESTRATOR_PROJECT_MANAGER_GITHUB_TOKEN in .env}"
      GIT_PROVIDER_MCP_TOKEN: "${PROJECT_MANAGER_GITHUB_MCP_TOKEN:?Set PROJECT_MANAGER_GITHUB_MCP_TOKEN in .env}"
    ports:
      - "127.0.0.1:${PROJECT_MANAGER_API_PORT:-18648}:8642"
    volumes:
      - project-manager-data:/opt/data
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-project-manager:/etc/hermes:ro
      - ./profiles/hermes-project-manager/SOUL.md:/opt/data/SOUL.md:ro

  hermes-builder:
    <<: *hermes-common
    container_name: hermes-builder
    env_file: [./secrets/hermes-builder.env]
    environment:
      <<: *hermes-environment
      HERMES_WRITE_SAFE_ROOT: /opt/data
      ORCHESTRATOR_ROLE: builder
      ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_BUILDER_GITHUB_TOKEN:?Set ORCHESTRATOR_BUILDER_GITHUB_TOKEN in .env}"
      GIT_PROVIDER_MCP_TOKEN: "${BUILDER_GITHUB_MCP_TOKEN:?Set BUILDER_GITHUB_MCP_TOKEN in .env}"
    ports:
      - "127.0.0.1:${BUILDER_API_PORT:-18643}:8642"
    volumes:
      - builder-data:/opt/data
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-builder:/etc/hermes:ro
      - ./profiles/hermes-builder/SOUL.md:/opt/data/SOUL.md:ro

  hermes-reviewer:
    <<: *hermes-common
    container_name: hermes-reviewer
    env_file: [./secrets/hermes-reviewer.env]
    environment:
      <<: *hermes-environment
      ORCHESTRATOR_ROLE: reviewer
      ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_REVIEWER_GITHUB_TOKEN:?Set ORCHESTRATOR_REVIEWER_GITHUB_TOKEN in .env}"
      GIT_PROVIDER_MCP_TOKEN: "${REVIEWER_GITHUB_MCP_TOKEN:?Set REVIEWER_GITHUB_MCP_TOKEN in .env}"
    ports:
      - "127.0.0.1:${REVIEWER_API_PORT:-18644}:8642"
    volumes:
      - reviewer-data:/opt/data
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-reviewer:/etc/hermes:ro
      - ./profiles/hermes-reviewer/SOUL.md:/opt/data/SOUL.md:ro

  hermes-release:
    <<: *hermes-common
    container_name: hermes-release
    env_file: [./secrets/hermes-release.env]
    environment:
      <<: *hermes-environment
      ORCHESTRATOR_ROLE: release
      ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_RELEASE_GITHUB_TOKEN:?Set ORCHESTRATOR_RELEASE_GITHUB_TOKEN in .env}"
      GIT_PROVIDER_MCP_TOKEN: "${RELEASE_GITHUB_MCP_TOKEN:?Set RELEASE_GITHUB_MCP_TOKEN in .env}"
    ports:
      - "127.0.0.1:${RELEASE_API_PORT:-18645}:8642"
    volumes:
      - release-data:/opt/data
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-release:/etc/hermes:ro
      - ./profiles/hermes-release/SOUL.md:/opt/data/SOUL.md:ro

  hermes-incident:
    <<: *hermes-common
    container_name: hermes-incident
    env_file: [./secrets/hermes-incident.env]
    environment:
      <<: *hermes-environment
      ORCHESTRATOR_ROLE: incident
      ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_INCIDENT_GITHUB_TOKEN:?Set ORCHESTRATOR_INCIDENT_GITHUB_TOKEN in .env}"
      GIT_PROVIDER_MCP_TOKEN: "${INCIDENT_GITHUB_MCP_TOKEN:?Set INCIDENT_GITHUB_MCP_TOKEN in .env}"
    ports:
      - "127.0.0.1:${INCIDENT_API_PORT:-18646}:8642"
    volumes:
      - incident-data:/opt/data
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-incident:/etc/hermes:ro
      - ./profiles/hermes-incident/SOUL.md:/opt/data/SOUL.md:ro

  hermes-learning:
    <<: *hermes-common
    container_name: hermes-learning
    env_file: [./secrets/hermes-learning.env]
    environment:
      <<: *hermes-environment
      ORCHESTRATOR_ROLE: learning
      ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_LEARNING_GITHUB_TOKEN:?Set ORCHESTRATOR_LEARNING_GITHUB_TOKEN in .env}"
      GIT_PROVIDER_MCP_TOKEN: "${LEARNING_GITHUB_MCP_TOKEN:?Set LEARNING_GITHUB_MCP_TOKEN in .env}"
    ports:
      - "127.0.0.1:${LEARNING_API_PORT:-18647}:8642"
    volumes:
      - learning-data:/opt/data
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-learning:/etc/hermes:ro
      - ./profiles/hermes-learning/SOUL.md:/opt/data/SOUL.md:ro

networks:
  hermes-control:
    driver: bridge

volumes:
  shared-skills:
  planner-data:
  project-manager-data:
  builder-data:
  reviewer-data:
  release-data:
  incident-data:
  learning-data:
