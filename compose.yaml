name: hermes-sdlc

x-hermes-environment: &hermes-environment
  HERMES_MANAGED_DIR: /etc/hermes
  HERMES_DASHBOARD: "0"
  API_SERVER_ENABLED: "true"
  API_SERVER_HOST: "0.0.0.0"
  API_SERVER_PORT: "8642"
  HERMES_WRITE_SAFE_ROOT: /opt/data
  HERMES_WORKSPACE_DIR: /opt/data/workspace
  OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}"
  GIT_PROVIDER_MCP_URL: "${GIT_PROVIDER_MCP_URL:?Set GIT_PROVIDER_MCP_URL in .env}"
  REPOSITORY_ID: "${REPOSITORY_ID:?Set REPOSITORY_ID in .env}"
  REPOSITORY_PROVIDER: "${REPOSITORY_PROVIDER:?Set REPOSITORY_PROVIDER in .env}"
  REPOSITORY_ACCESS_MODE: "${REPOSITORY_ACCESS_MODE:?Set REPOSITORY_ACCESS_MODE in .env}"
  REPOSITORY_DEFAULT_BRANCH: "${REPOSITORY_DEFAULT_BRANCH:?Set REPOSITORY_DEFAULT_BRANCH in .env}"
  REPOSITORY_CLONE_ALLOWED: "${REPOSITORY_CLONE_ALLOWED:?Set REPOSITORY_CLONE_ALLOWED in .env}"
  GITHUB_API_BASE_URL: "${GITHUB_API_BASE_URL:?Set GITHUB_API_BASE_URL in .env}"
  GITHUB_WEB_BASE_URL: "${GITHUB_WEB_BASE_URL:?Set GITHUB_WEB_BASE_URL in .env}"
  GITHUB_OWNER: "${GITHUB_OWNER:?Set GITHUB_OWNER in .env}"
  GITHUB_REPOSITORY: "${GITHUB_REPOSITORY:?Set GITHUB_REPOSITORY in .env}"
  GITHUB_REPOSITORY_FULL_NAME: "${GITHUB_REPOSITORY_FULL_NAME:?Set GITHUB_REPOSITORY_FULL_NAME in .env}"
  GITHUB_REPOSITORY_HTML_URL: "${GITHUB_REPOSITORY_HTML_URL:?Set GITHUB_REPOSITORY_HTML_URL in .env}"
  GITHUB_REPOSITORY_API_URL: "${GITHUB_REPOSITORY_API_URL:?Set GITHUB_REPOSITORY_API_URL in .env}"
  ORCHESTRATOR_ENABLED: "${ORCHESTRATOR_ENABLED:-false}"
  ORCHESTRATOR_PROVIDER: "${ORCHESTRATOR_PROVIDER:-github}"
  ORCHESTRATOR_CRON_SCHEDULE: "${ORCHESTRATOR_CRON_SCHEDULE:-*/5 * * * *}"
  ORCHESTRATOR_DB_PATH: /opt/data/sdlc-orchestrator/orchestrator.sqlite
  ORCHESTRATOR_LOCK_PATH: /opt/data/sdlc-orchestrator/run_once.lock
  ORCHESTRATOR_HERMES_URL: http://127.0.0.1:8642
  ORCHESTRATOR_MAX_STARTS_PER_TICK: "${ORCHESTRATOR_MAX_STARTS_PER_TICK:-1}"
  ORCHESTRATOR_RUN_TIMEOUT_SECONDS: "${ORCHESTRATOR_RUN_TIMEOUT_SECONDS:-5400}"
  ORCHESTRATOR_MAX_ATTEMPTS_PER_ASSIGNMENT: "${ORCHESTRATOR_MAX_ATTEMPTS_PER_ASSIGNMENT:-3}"
  ORCHESTRATOR_RETRY_DELAY_SECONDS: "${ORCHESTRATOR_RETRY_DELAY_SECONDS:-300}"
  ORCHESTRATOR_RETRY_LOST_RUNS: "${ORCHESTRATOR_RETRY_LOST_RUNS:-true}"
  ORCHESTRATOR_RETRY_TRANSIENT_FAILURES: "${ORCHESTRATOR_RETRY_TRANSIENT_FAILURES:-true}"
  ORCHESTRATOR_APPLY_TRANSITIONS: "${ORCHESTRATOR_APPLY_TRANSITIONS:-false}"
  ORCHESTRATOR_TRANSITION_COMMENT_ONLY: "${ORCHESTRATOR_TRANSITION_COMMENT_ONLY:-true}"
  ORCHESTRATOR_FINAL_RESPONSE_REPAIR_ENABLED: "${ORCHESTRATOR_FINAL_RESPONSE_REPAIR_ENABLED:-true}"
  ORCHESTRATOR_FINAL_RESPONSE_MODEL_REPAIR_ENABLED: "${ORCHESTRATOR_FINAL_RESPONSE_MODEL_REPAIR_ENABLED:-true}"
  ORCHESTRATOR_FINAL_RESPONSE_REPAIR_MODEL: "${ORCHESTRATOR_FINAL_RESPONSE_REPAIR_MODEL:-hermes-json-repair}"
  ORCHESTRATOR_FINAL_RESPONSE_REPAIR_TIMEOUT_SECONDS: "${ORCHESTRATOR_FINAL_RESPONSE_REPAIR_TIMEOUT_SECONDS:-120}"
  ORCHESTRATOR_FINAL_RESPONSE_REPAIR_MAX_CHARS: "${ORCHESTRATOR_FINAL_RESPONSE_REPAIR_MAX_CHARS:-200000}"
  HERMES_DEFAULT_HERMES_JSON_REPAIR_MODEL_ID: "${HERMES_JSON_REPAIR_MODEL_ID:-${HERMES_MODEL_ID:?Set HERMES_MODEL_ID in .env}}"
  HERMES_DEFAULT_HERMES_JSON_REPAIR_MODEL_BASE_URL: "${HERMES_JSON_REPAIR_MODEL_BASE_URL:-${HERMES_MODEL_BASE_URL:?Set HERMES_MODEL_BASE_URL in .env}}"
  HERMES_DEFAULT_HERMES_JSON_REPAIR_OPENAI_API_KEY: "${HERMES_JSON_REPAIR_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}"
  PYTHONPATH: /opt/hermes-sdlc-orchestrator

x-hermes-common: &hermes-common
  image: "${HERMES_ORCHESTRATOR_IMAGE:-hermes-sdlc-agent-orchestrator:local}"
  build:
    context: .
    dockerfile: Dockerfile.orchestrator
    args:
      HERMES_BASE_IMAGE: "${HERMES_IMAGE:-nousresearch/hermes-agent:latest}"
  entrypoint: [/opt/hermes-sdlc-orchestrator/bin/hermes-with-orchestrator.sh]
  depends_on:
    skills-superset-sync:
      condition: service_completed_successfully
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  pids_limit: 512
  cpus: "2.0"
  mem_limit: 4g
  stop_grace_period: 45s
  extra_hosts:
    - host.docker.internal:host-gateway
  networks:
    - hermes-control
  healthcheck:
    test: [CMD, curl, -fsS, http://127.0.0.1:8642/health]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 45s
services:
  skills-superset-sync:
    image: alpine/git:2.49.1
    entrypoint: []
    container_name: hermes-skills-superset-sync
    restart: "no"
    environment:
      SKILLS_SUPERSET_REPO_URL: "${SKILLS_SUPERSET_REPO_URL:-https://github.com/stanta/skills_superset.git}"
      SKILLS_SUPERSET_REF: "${SKILLS_SUPERSET_REF:-main}"
    command:
      - /bin/sh
      - -ec
      - |
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$${tmp_dir}"' EXIT
        git clone --depth=1 --filter=blob:none --sparse "$${SKILLS_SUPERSET_REPO_URL}" "$${tmp_dir}/repo"
        git -C "$${tmp_dir}/repo" checkout "$${SKILLS_SUPERSET_REF}"
        git -C "$${tmp_dir}/repo" sparse-checkout set skills
        rm -rf /shared/.next /shared/current
        mkdir -p /shared/.next
        cp -a "$${tmp_dir}/repo/skills/." /shared/.next/
        mv /shared/.next /shared/current
    networks:
      - hermes-control
    volumes:
      - shared-skills:/shared

  hermes-planner:
    <<: *hermes-common
    container_name: hermes-planner
    env_file:
      - path: ./secrets/hermes-planner.env
        required: false
    environment:
      <<: *hermes-environment
      HERMES_DEFAULT_HERMES_MODEL_ID: "${PLANNER_HERMES_MODEL_ID:-${HERMES_MODEL_ID:?Set HERMES_MODEL_ID in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_BASE_URL: "${PLANNER_HERMES_MODEL_BASE_URL:-${HERMES_MODEL_BASE_URL:?Set HERMES_MODEL_BASE_URL in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_OPENAI_API_KEY: "${PLANNER_HERMES_MODEL_OPENAI_API_KEY:-${HERMES_MODEL_OPENAI_API_KEY:-}}"
      HERMES_DEFAULT_API_SERVER_KEY: "${PLANNER_API_SERVER_KEY:?Set PLANNER_API_SERVER_KEY in .env}"
      HERMES_DEFAULT_API_SERVER_MODEL_NAME: "${PLANNER_API_SERVER_MODEL_NAME:-hermes-planner}"
      ORCHESTRATOR_ROLE: planner
      HERMES_DEFAULT_ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_PLANNER_GITHUB_TOKEN:?Set ORCHESTRATOR_PLANNER_GITHUB_TOKEN in .env}"
      HERMES_DEFAULT_ORCHESTRATOR_GITLAB_TOKEN: "${ORCHESTRATOR_PLANNER_GITLAB_TOKEN:-}"
      GIT_PROVIDER_MCP_TOKEN: "${PLANNER_GITHUB_MCP_TOKEN:?Set PLANNER_GITHUB_MCP_TOKEN in .env}"
      HERMES_DEFAULT_BRAVE_API_KEY: "${PLANNER_BRAVE_API_KEY:-${BRAVE_API_KEY:-}}"
      HERMES_DEFAULT_CONTEXT7_DEFAULT_MINIMUM_TOKENS: "${PLANNER_CONTEXT7_DEFAULT_MINIMUM_TOKENS:-${CONTEXT7_DEFAULT_MINIMUM_TOKENS:-}}"
      HERMES_DEFAULT_MDB_MCP_CONNECTION_STRING: "${PLANNER_MDB_MCP_CONNECTION_STRING:-${MDB_MCP_CONNECTION_STRING:-}}"
      HERMES_DEFAULT_POSTGRES_MCP_CONNECTION_STRING: "${PLANNER_POSTGRES_MCP_CONNECTION_STRING:-${POSTGRES_MCP_CONNECTION_STRING:-}}"
    ports:
      - "127.0.0.1:${PLANNER_API_PORT:-18642}:8642"
    volumes:
      - planner-data:/opt/data
      - ./workspace/planner:/opt/data/workspace
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-planner:/etc/hermes:ro
      - ./profiles/hermes-planner/SOUL.md:/opt/data/SOUL.md:ro

  hermes-project-manager:
    <<: *hermes-common
    container_name: hermes-project-manager
    env_file:
      - path: ./secrets/hermes-project-manager.env
        required: false
    environment:
      <<: *hermes-environment
      HERMES_DEFAULT_HERMES_MODEL_ID: "${PROJECT_MANAGER_HERMES_MODEL_ID:-${HERMES_MODEL_ID:?Set HERMES_MODEL_ID in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_BASE_URL: "${PROJECT_MANAGER_HERMES_MODEL_BASE_URL:-${HERMES_MODEL_BASE_URL:?Set HERMES_MODEL_BASE_URL in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_OPENAI_API_KEY: "${PROJECT_MANAGER_HERMES_MODEL_OPENAI_API_KEY:-${HERMES_MODEL_OPENAI_API_KEY:-}}"
      HERMES_DEFAULT_API_SERVER_KEY: "${PROJECT_MANAGER_API_SERVER_KEY:?Set PROJECT_MANAGER_API_SERVER_KEY in .env}"
      HERMES_DEFAULT_API_SERVER_MODEL_NAME: "${PROJECT_MANAGER_API_SERVER_MODEL_NAME:-hermes-project-manager}"
      ORCHESTRATOR_ROLE: project-manager
      HERMES_DEFAULT_ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_PROJECT_MANAGER_GITHUB_TOKEN:?Set ORCHESTRATOR_PROJECT_MANAGER_GITHUB_TOKEN in .env}"
      HERMES_DEFAULT_ORCHESTRATOR_GITLAB_TOKEN: "${ORCHESTRATOR_PROJECT_MANAGER_GITLAB_TOKEN:-}"
      GIT_PROVIDER_MCP_TOKEN: "${PROJECT_MANAGER_GITHUB_MCP_TOKEN:?Set PROJECT_MANAGER_GITHUB_MCP_TOKEN in .env}"
      HERMES_DEFAULT_BRAVE_API_KEY: "${PROJECT_MANAGER_BRAVE_API_KEY:-${BRAVE_API_KEY:-}}"
      HERMES_DEFAULT_CONTEXT7_DEFAULT_MINIMUM_TOKENS: "${PROJECT_MANAGER_CONTEXT7_DEFAULT_MINIMUM_TOKENS:-${CONTEXT7_DEFAULT_MINIMUM_TOKENS:-}}"
      HERMES_DEFAULT_MDB_MCP_CONNECTION_STRING: "${PROJECT_MANAGER_MDB_MCP_CONNECTION_STRING:-${MDB_MCP_CONNECTION_STRING:-}}"
      HERMES_DEFAULT_POSTGRES_MCP_CONNECTION_STRING: "${PROJECT_MANAGER_POSTGRES_MCP_CONNECTION_STRING:-${POSTGRES_MCP_CONNECTION_STRING:-}}"
    ports:
      - "127.0.0.1:${PROJECT_MANAGER_API_PORT:-18648}:8642"
    volumes:
      - project-manager-data:/opt/data
      - ./workspace/project-manager:/opt/data/workspace
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-project-manager:/etc/hermes:ro
      - ./profiles/hermes-project-manager/SOUL.md:/opt/data/SOUL.md:ro

  hermes-builder:
    <<: *hermes-common
    container_name: hermes-builder
    env_file:
      - path: ./secrets/hermes-builder.env
        required: false
    environment:
      <<: *hermes-environment
      HERMES_DEFAULT_HERMES_MODEL_ID: "${BUILDER_HERMES_MODEL_ID:-${HERMES_MODEL_ID:?Set HERMES_MODEL_ID in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_BASE_URL: "${BUILDER_HERMES_MODEL_BASE_URL:-${HERMES_MODEL_BASE_URL:?Set HERMES_MODEL_BASE_URL in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_OPENAI_API_KEY: "${BUILDER_HERMES_MODEL_OPENAI_API_KEY:-${HERMES_MODEL_OPENAI_API_KEY:-}}"
      HERMES_DEFAULT_API_SERVER_KEY: "${BUILDER_API_SERVER_KEY:?Set BUILDER_API_SERVER_KEY in .env}"
      HERMES_DEFAULT_API_SERVER_MODEL_NAME: "${BUILDER_API_SERVER_MODEL_NAME:-hermes-builder}"
      HERMES_WRITE_SAFE_ROOT: /opt/data
      ORCHESTRATOR_ROLE: builder
      HERMES_DEFAULT_ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_BUILDER_GITHUB_TOKEN:?Set ORCHESTRATOR_BUILDER_GITHUB_TOKEN in .env}"
      HERMES_DEFAULT_ORCHESTRATOR_GITLAB_TOKEN: "${ORCHESTRATOR_BUILDER_GITLAB_TOKEN:-}"
      GIT_PROVIDER_MCP_TOKEN: "${BUILDER_GITHUB_MCP_TOKEN:?Set BUILDER_GITHUB_MCP_TOKEN in .env}"
      HERMES_DEFAULT_BRAVE_API_KEY: "${BUILDER_BRAVE_API_KEY:-${BRAVE_API_KEY:-}}"
      HERMES_DEFAULT_CONTEXT7_DEFAULT_MINIMUM_TOKENS: "${BUILDER_CONTEXT7_DEFAULT_MINIMUM_TOKENS:-${CONTEXT7_DEFAULT_MINIMUM_TOKENS:-}}"
      HERMES_DEFAULT_MDB_MCP_CONNECTION_STRING: "${BUILDER_MDB_MCP_CONNECTION_STRING:-${MDB_MCP_CONNECTION_STRING:-}}"
      HERMES_DEFAULT_POSTGRES_MCP_CONNECTION_STRING: "${BUILDER_POSTGRES_MCP_CONNECTION_STRING:-${POSTGRES_MCP_CONNECTION_STRING:-}}"
    ports:
      - "127.0.0.1:${BUILDER_API_PORT:-18643}:8642"
    volumes:
      - builder-data:/opt/data
      - ./workspace/builder:/opt/data/workspace
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-builder:/etc/hermes:ro
      - ./profiles/hermes-builder/SOUL.md:/opt/data/SOUL.md:ro

  hermes-reviewer:
    <<: *hermes-common
    container_name: hermes-reviewer
    env_file:
      - path: ./secrets/hermes-reviewer.env
        required: false
    environment:
      <<: *hermes-environment
      HERMES_DEFAULT_HERMES_MODEL_ID: "${REVIEWER_HERMES_MODEL_ID:-${HERMES_MODEL_ID:?Set HERMES_MODEL_ID in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_BASE_URL: "${REVIEWER_HERMES_MODEL_BASE_URL:-${HERMES_MODEL_BASE_URL:?Set HERMES_MODEL_BASE_URL in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_OPENAI_API_KEY: "${REVIEWER_HERMES_MODEL_OPENAI_API_KEY:-${HERMES_MODEL_OPENAI_API_KEY:-}}"
      HERMES_DEFAULT_API_SERVER_KEY: "${REVIEWER_API_SERVER_KEY:?Set REVIEWER_API_SERVER_KEY in .env}"
      HERMES_DEFAULT_API_SERVER_MODEL_NAME: "${REVIEWER_API_SERVER_MODEL_NAME:-hermes-reviewer}"
      ORCHESTRATOR_ROLE: reviewer
      HERMES_DEFAULT_ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_REVIEWER_GITHUB_TOKEN:?Set ORCHESTRATOR_REVIEWER_GITHUB_TOKEN in .env}"
      HERMES_DEFAULT_ORCHESTRATOR_GITLAB_TOKEN: "${ORCHESTRATOR_REVIEWER_GITLAB_TOKEN:-}"
      GIT_PROVIDER_MCP_TOKEN: "${REVIEWER_GITHUB_MCP_TOKEN:?Set REVIEWER_GITHUB_MCP_TOKEN in .env}"
      HERMES_DEFAULT_BRAVE_API_KEY: "${REVIEWER_BRAVE_API_KEY:-${BRAVE_API_KEY:-}}"
      HERMES_DEFAULT_CONTEXT7_DEFAULT_MINIMUM_TOKENS: "${REVIEWER_CONTEXT7_DEFAULT_MINIMUM_TOKENS:-${CONTEXT7_DEFAULT_MINIMUM_TOKENS:-}}"
      HERMES_DEFAULT_MDB_MCP_CONNECTION_STRING: "${REVIEWER_MDB_MCP_CONNECTION_STRING:-${MDB_MCP_CONNECTION_STRING:-}}"
      HERMES_DEFAULT_POSTGRES_MCP_CONNECTION_STRING: "${REVIEWER_POSTGRES_MCP_CONNECTION_STRING:-${POSTGRES_MCP_CONNECTION_STRING:-}}"
    ports:
      - "127.0.0.1:${REVIEWER_API_PORT:-18644}:8642"
    volumes:
      - reviewer-data:/opt/data
      - ./workspace/reviewer:/opt/data/workspace
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-reviewer:/etc/hermes:ro
      - ./profiles/hermes-reviewer/SOUL.md:/opt/data/SOUL.md:ro

  hermes-release:
    <<: *hermes-common
    container_name: hermes-release
    env_file:
      - path: ./secrets/hermes-release.env
        required: false
    environment:
      <<: *hermes-environment
      HERMES_DEFAULT_HERMES_MODEL_ID: "${RELEASE_HERMES_MODEL_ID:-${HERMES_MODEL_ID:?Set HERMES_MODEL_ID in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_BASE_URL: "${RELEASE_HERMES_MODEL_BASE_URL:-${HERMES_MODEL_BASE_URL:?Set HERMES_MODEL_BASE_URL in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_OPENAI_API_KEY: "${RELEASE_HERMES_MODEL_OPENAI_API_KEY:-${HERMES_MODEL_OPENAI_API_KEY:-}}"
      HERMES_DEFAULT_API_SERVER_KEY: "${RELEASE_API_SERVER_KEY:?Set RELEASE_API_SERVER_KEY in .env}"
      HERMES_DEFAULT_API_SERVER_MODEL_NAME: "${RELEASE_API_SERVER_MODEL_NAME:-hermes-release}"
      ORCHESTRATOR_ROLE: release
      HERMES_DEFAULT_ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_RELEASE_GITHUB_TOKEN:?Set ORCHESTRATOR_RELEASE_GITHUB_TOKEN in .env}"
      HERMES_DEFAULT_ORCHESTRATOR_GITLAB_TOKEN: "${ORCHESTRATOR_RELEASE_GITLAB_TOKEN:-}"
      GIT_PROVIDER_MCP_TOKEN: "${RELEASE_GITHUB_MCP_TOKEN:?Set RELEASE_GITHUB_MCP_TOKEN in .env}"
      HERMES_DEFAULT_BRAVE_API_KEY: "${RELEASE_BRAVE_API_KEY:-${BRAVE_API_KEY:-}}"
      HERMES_DEFAULT_CONTEXT7_DEFAULT_MINIMUM_TOKENS: "${RELEASE_CONTEXT7_DEFAULT_MINIMUM_TOKENS:-${CONTEXT7_DEFAULT_MINIMUM_TOKENS:-}}"
      HERMES_DEFAULT_MDB_MCP_CONNECTION_STRING: "${RELEASE_MDB_MCP_CONNECTION_STRING:-${MDB_MCP_CONNECTION_STRING:-}}"
      HERMES_DEFAULT_POSTGRES_MCP_CONNECTION_STRING: "${RELEASE_POSTGRES_MCP_CONNECTION_STRING:-${POSTGRES_MCP_CONNECTION_STRING:-}}"
    ports:
      - "127.0.0.1:${RELEASE_API_PORT:-18645}:8642"
    volumes:
      - release-data:/opt/data
      - ./workspace/release:/opt/data/workspace
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-release:/etc/hermes:ro
      - ./profiles/hermes-release/SOUL.md:/opt/data/SOUL.md:ro

  hermes-incident:
    <<: *hermes-common
    container_name: hermes-incident
    env_file:
      - path: ./secrets/hermes-incident.env
        required: false
    environment:
      <<: *hermes-environment
      HERMES_DEFAULT_HERMES_MODEL_ID: "${INCIDENT_HERMES_MODEL_ID:-${HERMES_MODEL_ID:?Set HERMES_MODEL_ID in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_BASE_URL: "${INCIDENT_HERMES_MODEL_BASE_URL:-${HERMES_MODEL_BASE_URL:?Set HERMES_MODEL_BASE_URL in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_OPENAI_API_KEY: "${INCIDENT_HERMES_MODEL_OPENAI_API_KEY:-${HERMES_MODEL_OPENAI_API_KEY:-}}"
      HERMES_DEFAULT_API_SERVER_KEY: "${INCIDENT_API_SERVER_KEY:?Set INCIDENT_API_SERVER_KEY in .env}"
      HERMES_DEFAULT_API_SERVER_MODEL_NAME: "${INCIDENT_API_SERVER_MODEL_NAME:-hermes-incident}"
      ORCHESTRATOR_ROLE: incident
      HERMES_DEFAULT_ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_INCIDENT_GITHUB_TOKEN:?Set ORCHESTRATOR_INCIDENT_GITHUB_TOKEN in .env}"
      HERMES_DEFAULT_ORCHESTRATOR_GITLAB_TOKEN: "${ORCHESTRATOR_INCIDENT_GITLAB_TOKEN:-}"
      GIT_PROVIDER_MCP_TOKEN: "${INCIDENT_GITHUB_MCP_TOKEN:?Set INCIDENT_GITHUB_MCP_TOKEN in .env}"
      HERMES_DEFAULT_BRAVE_API_KEY: "${INCIDENT_BRAVE_API_KEY:-${BRAVE_API_KEY:-}}"
      HERMES_DEFAULT_CONTEXT7_DEFAULT_MINIMUM_TOKENS: "${INCIDENT_CONTEXT7_DEFAULT_MINIMUM_TOKENS:-${CONTEXT7_DEFAULT_MINIMUM_TOKENS:-}}"
      HERMES_DEFAULT_MDB_MCP_CONNECTION_STRING: "${INCIDENT_MDB_MCP_CONNECTION_STRING:-${MDB_MCP_CONNECTION_STRING:-}}"
      HERMES_DEFAULT_POSTGRES_MCP_CONNECTION_STRING: "${INCIDENT_POSTGRES_MCP_CONNECTION_STRING:-${POSTGRES_MCP_CONNECTION_STRING:-}}"
    ports:
      - "127.0.0.1:${INCIDENT_API_PORT:-18646}:8642"
    volumes:
      - incident-data:/opt/data
      - ./workspace/incident:/opt/data/workspace
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-incident:/etc/hermes:ro
      - ./profiles/hermes-incident/SOUL.md:/opt/data/SOUL.md:ro

  hermes-learning:
    <<: *hermes-common
    container_name: hermes-learning
    env_file:
      - path: ./secrets/hermes-learning.env
        required: false
    environment:
      <<: *hermes-environment
      HERMES_DEFAULT_HERMES_MODEL_ID: "${LEARNING_HERMES_MODEL_ID:-${HERMES_MODEL_ID:?Set HERMES_MODEL_ID in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_BASE_URL: "${LEARNING_HERMES_MODEL_BASE_URL:-${HERMES_MODEL_BASE_URL:?Set HERMES_MODEL_BASE_URL in .env}}"
      HERMES_DEFAULT_HERMES_MODEL_OPENAI_API_KEY: "${LEARNING_HERMES_MODEL_OPENAI_API_KEY:-${HERMES_MODEL_OPENAI_API_KEY:-}}"
      HERMES_DEFAULT_API_SERVER_KEY: "${LEARNING_API_SERVER_KEY:?Set LEARNING_API_SERVER_KEY in .env}"
      HERMES_DEFAULT_API_SERVER_MODEL_NAME: "${LEARNING_API_SERVER_MODEL_NAME:-hermes-learning}"
      ORCHESTRATOR_ROLE: learning
      HERMES_DEFAULT_ORCHESTRATOR_GITHUB_TOKEN: "${ORCHESTRATOR_LEARNING_GITHUB_TOKEN:?Set ORCHESTRATOR_LEARNING_GITHUB_TOKEN in .env}"
      HERMES_DEFAULT_ORCHESTRATOR_GITLAB_TOKEN: "${ORCHESTRATOR_LEARNING_GITLAB_TOKEN:-}"
      GIT_PROVIDER_MCP_TOKEN: "${LEARNING_GITHUB_MCP_TOKEN:?Set LEARNING_GITHUB_MCP_TOKEN in .env}"
      HERMES_DEFAULT_BRAVE_API_KEY: "${LEARNING_BRAVE_API_KEY:-${BRAVE_API_KEY:-}}"
      HERMES_DEFAULT_CONTEXT7_DEFAULT_MINIMUM_TOKENS: "${LEARNING_CONTEXT7_DEFAULT_MINIMUM_TOKENS:-${CONTEXT7_DEFAULT_MINIMUM_TOKENS:-}}"
      HERMES_DEFAULT_MDB_MCP_CONNECTION_STRING: "${LEARNING_MDB_MCP_CONNECTION_STRING:-${MDB_MCP_CONNECTION_STRING:-}}"
      HERMES_DEFAULT_POSTGRES_MCP_CONNECTION_STRING: "${LEARNING_POSTGRES_MCP_CONNECTION_STRING:-${POSTGRES_MCP_CONNECTION_STRING:-}}"
    ports:
      - "127.0.0.1:${LEARNING_API_PORT:-18647}:8642"
    volumes:
      - learning-data:/opt/data
      - ./workspace/learning:/opt/data/workspace
      - shared-skills:/opt/hermes-shared-skills:ro
      - ./orchestrator:/opt/hermes-sdlc-orchestrator:ro
      - ./profiles/hermes-learning:/etc/hermes:ro
      - ./profiles/hermes-learning/SOUL.md:/opt/data/SOUL.md:ro

networks:
  hermes-control:
    driver: bridge

volumes:
  shared-skills:
  planner-data:
  project-manager-data:
  builder-data:
  reviewer-data:
  release-data:
  incident-data:
  learning-data:
