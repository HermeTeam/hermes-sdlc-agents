apiVersion: sdlc.hermes/v1alpha1
kind: AgentRolePolicy
metadata:
  name: hermes-sdlc-roles
spec:
  authentication:
    audience: git-provider-mcp
    roleClaim: role
    subjectClaim: sub
    requiredClaims: [iss, sub, aud, role, exp, jti]
    maximumTokenTtlSeconds: 3600
  authorization:
    defaultDecision: deny
    denyUnknownTools: true
    denyWildcardTools: true
    requireServerSideEnforcement: true
    auditEveryMutation: true
  roles:
    hermes-planner:
      allowTools:
        - get_file_contents
        - get_repository_tree
        - search_code
        - issue_read
        - list_issues
      constraints:
        environments: [none]
        repositoryMode: read-only
        writableArtifactTypes: [spec, plan]
        denyProduction: true
        denyDeployments: true

    hermes-project-manager:
      allowTools:
        - get_file_contents
        - get_repository_tree
        - search_code
        - issue_read
        - list_issues
        - add_issue_comment
        - create_issue
      constraints:
        environments: [none]
        repositoryMode: read-only
        writableArtifactTypes: [charter, roadmap, backlog, status, decision, risk, retrospective]
        allowedMutations: [add_issue_comment, create_issue]
        denyCodeMutation: true
        denyBranchMutation: true
        denyProduction: true
        denyDeployments: true
        requireHumanApprovalForCommitmentChange: true

    hermes-builder:
      allowTools:
        - get_file_contents
        - get_repository_tree
        - search_code
        - create_branch
        - push_files
        - create_pull_request
        - actions_run_trigger
        - actions_get
        - actions_list
        - get_job_logs
      constraints:
        branchPrefix: agent/
        protectedBranches: [main, master, release/*]
        allowedPushMode: api-managed-task-branch-only
        merge: deny
        production: deny
        qualityGateMutation: deny
        protectedPathsFile: policies/protected-paths.txt

    hermes-reviewer:
      allowTools:
        - pull_request_read
        - get_file_contents
        - actions_get
        - actions_list
        - get_job_logs
        - add_issue_comment
      constraints:
        repositoryMode: read-only
        authorBranchMutation: deny
        merge: deny
        production: deny
        prohibitSelfReview: true

    hermes-release:
      allowTools:
        - actions_get
        - actions_list
      constraints:
        allowedMutations: []
        requireImmutableCandidate: true
        requireExpectedRevision: true
        requirePolicyEvaluationId: true
        requireIdempotencyKey: true
        arbitraryKubectl: deny
        codeMutation: deny
        qualityGateMutation: deny

    hermes-incident:
      allowTools:
        - issue_read
        - list_issues
        - add_issue_comment
      constraints:
        allowedMutations: [add_issue_comment]
        featureFlagDirection: enabled-to-disabled-only
        requireIncidentId: true
        requireExpectedVersion: true
        requireIdempotencyKey: true
        runbookApprovalState: approved
        arbitraryInfrastructure: deny
        codeMutation: deny

    hermes-learning:
      allowTools:
        - issue_read
        - list_issues
        - add_issue_comment
        - create_issue
      constraints:
        dataMode: aggregated-and-redacted
        allowedMutations: [add_issue_comment, create_issue]
        directDocumentationMutation: deny
        skillActivation: deny
        skillPublication: deny
        production: deny
        requireHumanApproval: true
