services:
  capability-gateway:
    image: "${CAPABILITY_GATEWAY_IMAGE:-hermeteam-capability-gateway:local}"
    build:
      context: ./capability_gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    cpus: "0.75"
    mem_limit: 512m
    environment:
      CAPABILITY_GATEWAY_BIND: "0.0.0.0"
      CAPABILITY_GATEWAY_PORT: "8787"
      CAPABILITY_GATEWAY_DB: /opt/data/capability-gateway.sqlite3
      CAPABILITY_MAX_AUTO_RISK: "${CAPABILITY_MAX_AUTO_RISK:-MEDIUM}"
      CAPABILITY_ADMIN_KEY: "${CAPABILITY_ADMIN_KEY:?Set CAPABILITY_ADMIN_KEY in .env}"
      CAPABILITY_JUDGE_BASE_URL: "${CAPABILITY_JUDGE_BASE_URL:?Set CAPABILITY_JUDGE_BASE_URL in .env}"
      CAPABILITY_JUDGE_API_KEY: "${CAPABILITY_JUDGE_API_KEY:?Set CAPABILITY_JUDGE_API_KEY in .env}"
      CAPABILITY_JUDGE_MODEL: "${CAPABILITY_JUDGE_MODEL:?Set CAPABILITY_JUDGE_MODEL in .env}"
    volumes:
      - capability-gateway-data:/opt/data
    networks:
      - hermes-control
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2).read()"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  hermeteam-dashboard:
    environment:
      CAPABILITY_GATEWAY_URL: http://capability-gateway:8787
      CAPABILITY_ADMIN_KEY: "${CAPABILITY_ADMIN_KEY:?Set CAPABILITY_ADMIN_KEY in .env}"
      DASHBOARD_GOVERNANCE_KEY: "${DASHBOARD_GOVERNANCE_KEY:?Set DASHBOARD_GOVERNANCE_KEY in .env}"
    depends_on:
      capability-gateway:
        condition: service_healthy

volumes:
  capability-gateway-data:
